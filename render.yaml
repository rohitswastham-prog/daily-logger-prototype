# Render Blueprint for the Daily Log prototype backend (https://render.com/docs/blueprint-spec).
#
# Deploy: Render dashboard → New → Blueprint → pick this repo. Render creates the service from this file and
# asks for GROQ_API_KEY (sync: false = typed in the dashboard, never stored in Git).
#
# A service made with New → Web Service instead (not a Blueprint) ignores this file. The repo still works
# with Render's defaults, as long as Root Directory is empty and these two commands are set:
#   Build:  pip install -r requirements.txt
#   Start:  uvicorn main:app --host 0.0.0.0 --port $PORT
# Python 3.11.9 comes from .python-version.
#
# Then build the Android app against the service URL:
#   gradlew assembleRelease -PbackendUrl=https://<service-name>.onrender.com/
#
# Prototype only: test data, Groq processes in the US, sign-in has no OTP.

services:
  - type: web
    name: daily-log-prototype
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_VISION_API_KEY # optional: empty = photos use GROQ_API_KEY
        sync: false
      - key: TEXT_MODELS # photos keep qwen to themselves
        value: openai/gpt-oss-120b,openai/gpt-oss-20b
      - key: VISION_MODELS
        value: qwen/qwen3.8-27b
      - key: STT_MODELS
        value: whisper-large-v3,whisper-large-v3-turbo
      - key: PHOTO_DAILY_CAP
        value: "4"
      - key: ADMIN_TOKEN # opens /admin; Render generates it, copy it from the Environment tab
        generateValue: true

# Free plan: the service sleeps after 15 minutes idle (first request then takes ~50 s), and the SQLite file
# resets on every deploy or restart, so accounts and saved logs disappear.
#
# To keep data, switch to the Starter plan and add a disk: change `plan: free` to `plan: starter`, add
#      - key: DB_PATH
#        value: /var/data/prototype.db
# under envVars, and add under the service:
#    disk:
#      name: data
#      mountPath: /var/data
#      sizeGB: 1
