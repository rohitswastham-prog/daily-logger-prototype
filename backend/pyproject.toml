[project]
name = "daily-log-prototype-backend"
version = "0.1.0"
description = "Prototype backend for the Daily Log demo app: phone sign-in, Groq LLM, Groq Whisper, Groq vision, SQLite."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "python-multipart>=0.0.12",
    "python-dotenv>=1.0",
    "tzdata>=2024.1",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
